    // Great Circle Distance calculation in statute miles
    function calcDistance(codeA, codeB) {
      const a = AIRPORT_DB.find(x => x.code === codeA);
      const b = AIRPORT_DB.find(x => x.code === codeB);
      if (!a || !b || codeA === codeB) return 0;
      const R = 3958.8; // Radius of Earth in statute miles
      const dLat = (b.lat - a.lat) * (Math.PI / 180);
      const dLon = (b.lon - a.lon) * (Math.PI / 180);
      const lat1 = a.lat * (Math.PI / 180);
      const lat2 = b.lat * (Math.PI / 180);
      const h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      return Math.round(R * c);
    }

    // Estimate base fare and points from distance and route type
    function calcRouteSpecs(origCode, destCode, cabinClass = "main") {
      const a = AIRPORT_DB.find(x => x.code === origCode);
      const b = AIRPORT_DB.find(x => x.code === destCode);
      const dist = calcDistance(origCode, destCode);
      if (!a || !b || dist === 0) return null;

      const isIntl = (a.region === "Europe" || b.region === "Europe" ||
                      a.region === "Asia/Oceania" || b.region === "Asia/Oceania" ||
                      a.region === "Latin America" || b.region === "Latin America" ||
                      a.region === "Middle East" || b.region === "Middle East");
      const type = isIntl ? "International" : "Domestic";

      // Base fare pricing estimation
      let base = isIntl ? (240 + dist * 0.20) : (65 + dist * 0.12);
      if (cabinClass === "premium") {
        base = isIntl ? (base * 3.4) : (base * 2.6);
      } else if (cabinClass === "basic") {
        base = base * 0.75;
      }
      const fare = Math.round(base);

      return { orig: a, dest: b, dist, fare, type };
    }

      const spendPts = Math.floor(spend * card.perDollar);

      return { pts: spendPts + bonus, headstart: 0, bonus, spendPts };
    }

      const reached = calc.qualified;
      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
          <div className="flex flex-wrap items-start justify-between gap-4">
            <div>
              <p className="text-xs font-semibold uppercase tracking-wider text-slate-500">Progress to {tier.name}</p>
              <p className="mt-1 text-4xl font-extrabold tracking-tight theme-fade" style={{ color: t.primary }}>
                {pct.toFixed(1)}<span className="text-2xl">%</span>
              </p>
            </div>
            <span className={"rounded-full px-3 py-1 text-xs font-bold " + (reached ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700")}>
              {reached ? (calc.viaAlt ? "Qualified via PQF path" : "Qualified ✓") : "Gap remaining"}
            </span>
          </div>

          <div className="mt-5 relative">
            <div className="h-5 rounded-full bg-slate-100 overflow-hidden flex">
              {calc.segments.map((s) => (
                <div key={s.label} className="bar-fill h-full" title={`${s.label}: ${fmt(s.value)}`}
                  style={{ width: `${Math.min(100, (s.value / tier.req) * 100)}%`, background: s.color }}></div>
              ))}
            </div>
            {airline.tiers.map((tr) => tr.req <= tier.req && tr.req !== tier.req && (
              <div key={tr.name} className="absolute top-0 h-5 border-l-2 border-white/90" style={{ left: `${(tr.req / tier.req) * 100}%` }} title={tr.name}></div>
            ))}
            <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-600">
              {calc.segments.map((s) => (
                <span key={s.label} className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: s.color }}></span>{s.label}: <b>{fmt(s.value)}</b></span>
              ))}
            </div>
          </div>

          <div className="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <Stat label={`Projected ${airline.metric}`} value={fmt(calc.total)} color={t.primary} />
            <Stat label={`Required ${airline.metric}`} value={fmt(tier.req)} color="#334155" />
            <Stat label="Gap remaining" value={reached ? "0" : fmt(calc.gap)} color={reached ? "#059669" : (t.red || t.accent)} />
          </div>

          {airline.key === "united" && tier.alt && (
            <div className="mt-4 rounded-xl p-4 text-sm theme-fade" style={{ background: t.soft }}>
              <p className="font-semibold" style={{ color: t.primary }}>Alternate path: {fmt(tier.alt.pqp)} PQP + {tier.alt.pqf} PQF</p>
              <div className="mt-2 grid sm:grid-cols-2 gap-3">
                <MiniBar label="PQP" value={calc.total} req={tier.alt.pqp} color={t.primary} />
                <MiniBar label="PQF" value={calc.pqf} req={tier.alt.pqf} color="#0a8f5a" />
              </div>
              {!reached && <p className="mt-2 text-slate-600">PQF path gap: <b>{fmt(Math.max(0, tier.alt.pqp - calc.total))} PQP</b> and <b>{Math.max(0, tier.alt.pqf - calc.pqf)} PQF</b>.</p>}
            </div>
          )}
        </div>
      );
    }

    function Stat({ label, value, color }) {
      return (
        <div className="rounded-xl bg-slate-50 border border-slate-200 p-4">
          <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide">{label}</p>
          <p className="mt-1 text-2xl font-extrabold tabular-nums" style={{ color }}>{value}</p>
        </div>
      );
    }

    function MiniBar({ label, value, req, color }) {
      const pct = Math.min(100, (value / req) * 100);
      return (
        <div>
          <div className="flex justify-between text-xs text-slate-600"><span>{label}</span><span className="tabular-nums">{fmt(value)} / {fmt(req)}</span></div>
          <div className="mt-1 h-2 rounded-full bg-white overflow-hidden"><div className="bar-fill h-full rounded-full" style={{ width: pct + "%", background: color }}></div></div>
        </div>
      );
    }

    function GapStrategy({ airline, card, calc, cardSpend, headstartOn }) {
      const t = airline.theme;
      const gap = calc.gap;
      const done = calc.qualified;
      const extraCard = cardSpendToClose(airline, card, cardSpend, gap, headstartOn);
      const totalCard = extraCard == null ? null : cardSpend + extraCard;
      const fareNeeded = Math.ceil(gap / airline.flightRate);

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
          <h3 className="font-bold text-lg">Gap Strategy Breakdown</h3>
          <p className="text-sm text-slate-500">Two ways to close the remaining {done ? 0 : fmt(gap)} {airline.metric} on their own — or mix both.</p>
          <div className="mt-4 grid sm:grid-cols-2 gap-4">
            <div className="rounded-xl border-2 p-5 theme-fade" style={{ borderColor: t.accent }}>
              <div className="flex items-center gap-2 text-sm font-semibold" style={{ color: t.accent }}>
                <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
                Card Spend Route
              </div>
              {done ? <p className="mt-3 text-2xl font-extrabold text-emerald-600">Already there 🎉</p>
                : extraCard == null ? <p className="mt-3 text-sm text-slate-600">Select a co-branded card to model this route.</p>
                : (
                  <>
                    <p className="mt-3 text-3xl font-extrabold tabular-nums">{usd(extraCard)}</p>
                    <p className="text-sm text-slate-600">additional spend on {card.name}</p>
                    <p className="mt-2 text-xs text-slate-500">Total annual card spend: <b>{usd(totalCard)}</b>{totalCard > SLIDER_MAX && <span className="text-amber-600"> (beyond simulator max)</span>}</p>
                    <p className="text-xs text-slate-500">Rate: {card.rateLabel}</p>
                  </>
                )}
            </div>
            <div className="rounded-xl border-2 p-5 theme-fade" style={{ borderColor: t.primary }}>
              <div className="flex items-center gap-2 text-sm font-semibold" style={{ color: t.primary }}>
                <svg viewBox="0 0 24 24" className="w-5 h-5" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                Flight Fares Route
              </div>
              {done ? <p className="mt-3 text-2xl font-extrabold text-emerald-600">Already there 🎉</p> : (
                <>
                  <p className="mt-3 text-3xl font-extrabold tabular-nums">{usd(fareNeeded)}</p>
                  <p className="text-sm text-slate-600">additional base fare on {airline.short}-marketed flights</p>
                  <p className="mt-2 text-xs text-slate-500">Rate: {airline.flightNote}</p>
                  {airline.key === "united" && <p className="text-xs text-slate-500">≈ {Math.ceil(fareNeeded / 350)} segments at ~$350 avg fare</p>}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- NEW: Route & Runway Segment Calculator (JAL Simulator Style) ---------------- */
    function RouteRunwayPlanner({ airline, gap, onAddFlightSpend }) {
      const t = airline.theme;

      // Custom Route State
      const [customOrig, setCustomOrig] = useState("BOS");
      const [customDest, setCustomDest] = useState("HND");
      const [customCabin, setCustomCabin] = useState("main");

      // Catalog Table State
      const [filterType, setFilterType] = useState("All");
      const [regionFilter, setRegionFilter] = useState("All");
      const [cabinClass, setCabinClass] = useState("main");
      const [searchQuery, setSearchQuery] = useState("");
      const [sortBy, setSortBy] = useState("remAsc");

      // Custom Route calculation
      const customSpec = useMemo(() => {
        return calcRouteSpecs(customOrig, customDest, customCabin);
      }, [customOrig, customDest, customCabin]);

      const customPts = customSpec ? getAirlineRoutePoints(airline.key, customSpec.fare, customCabin) : 0;
      const customRem = customPts > 0 && gap > 0 ? Math.ceil(gap / customPts) : 0;
      const customTotalCost = customRem * (customSpec ? customSpec.fare : 0);

      // Pre-compute catalog routes with real specs
      const evaluatedRoutes = useMemo(() => {
        return CATALOG_ROUTES.map((cr) => {
          const spec = calcRouteSpecs(cr.orig, cr.dest, cabinClass);
          if (!spec) return null;
          const pts = getAirlineRoutePoints(airline.key, spec.fare, cabinClass);
          const rem = pts > 0 && gap > 0 ? Math.ceil(gap / pts) : 0;
          return {
            id: `${cr.orig}_${cr.dest}`,
            origCode: cr.orig,
            destCode: cr.dest,
            origCity: spec.orig.city,
            destCity: spec.dest.city,
            name: `${cr.orig} ⇄ ${cr.dest}`,
            label: `${spec.orig.city.split(',')[0]} ⇄ ${spec.dest.city.split(',')[0]}`,
            region: cr.region,
            type: spec.type,
            dist: spec.dist,
            fare: spec.fare,
            pts,
            rem,
          };
        }).filter(Boolean);
      }, [cabinClass, airline.key, gap]);

      const filteredRoutes = useMemo(() => {
        return evaluatedRoutes.filter((r) => {
          const matchType = filterType === "All" || r.type === filterType;
          const matchRegion = regionFilter === "All" || r.region.toLowerCase().includes(regionFilter.toLowerCase());
          const q = searchQuery.toLowerCase();
          const matchSearch = !searchQuery ||
            r.origCode.toLowerCase().includes(q) ||
            r.destCode.toLowerCase().includes(q) ||
            r.origCity.toLowerCase().includes(q) ||
            r.destCity.toLowerCase().includes(q) ||
            r.region.toLowerCase().includes(q);
          return matchType && matchRegion && matchSearch;
        }).sort((a, b) => {
          if (sortBy === "remAsc") return a.rem - b.rem;
          if (sortBy === "fareAsc") return a.fare - b.fare;
          if (sortBy === "distDesc") return b.dist - a.dist;
          return 0;
        });
      }, [evaluatedRoutes, filterType, regionFilter, searchQuery, sortBy]);

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs uppercase tracking-wider font-extrabold px-2.5 py-0.5 rounded-full theme-fade text-white" style={{ background: t.primary }}>
                  100% Comprehensive Network Engine
                </span>
                <h3 className="font-bold text-lg text-slate-900">Flight Route & Mileage Runway Planner</h3>
              </div>
              <p className="text-xs text-slate-500 mt-1">
                JAL Simulator style: Select <b>ANY</b> origin and destination airport across 130+ domestic & global cities to calculate exact flight miles, points earned, and remaining flights needed to hit elite status.
              </p>
            </div>
          </div>

          {/* SECTION 1: Interactive "Any Airport to Any Airport" Calculator */}
          <div className="rounded-xl p-5 border-2 theme-fade" style={{ borderColor: t.primary, background: t.soft }}>
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="text-xs font-black uppercase tracking-wider px-2 py-0.5 rounded text-white" style={{ background: t.primary }}>
                  Custom Route Builder
                </span>
                <span className="text-sm font-bold text-slate-800">Calculate ANY Flight in the Network</span>
              </div>
              <span className="text-xs text-slate-500 hidden sm:inline">Every route that earns 1+ miles or points</span>
            </div>

            <div className="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
              {/* Origin selector */}
              <label className="block">
                <span className="text-xs font-bold text-slate-700">Origin Airport (From)</span>
                <select
                  value={customOrig}
                  onChange={(e) => setCustomOrig(e.target.value)}
                  className="mt-1 w-full text-xs font-bold px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
                >
                  {AIRPORT_DB.map((ap) => (
                    <option key={ap.code} value={ap.code}>
                      {ap.code} — {ap.city} ({ap.name})
                    </option>
                  ))}
                </select>
              </label>

              {/* Destination selector */}
              <label className="block">
                <span className="text-xs font-bold text-slate-700">Destination Airport (To)</span>
                <select
                  value={customDest}
                  onChange={(e) => setCustomDest(e.target.value)}
                  className="mt-1 w-full text-xs font-bold px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
                >
                  {AIRPORT_DB.map((ap) => (
                    <option key={ap.code} value={ap.code}>
                      {ap.code} — {ap.city} ({ap.name})
                    </option>
                  ))}
                </select>
              </label>

              {/* Cabin class selector */}
              <label className="block">
                <span className="text-xs font-bold text-slate-700">Cabin Class & Fare Type</span>
                <select
                  value={customCabin}
                  onChange={(e) => setCustomCabin(e.target.value)}
                  className="mt-1 w-full text-xs font-bold px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
                >
                  <option value="main">Standard Main Cabin / Economy</option>
                  <option value="premium">First / Business / Premium Cabin</option>
                  <option value="basic">Basic Economy (Discounted)</option>
                </select>
              </label>
            </div>

            {/* Custom calculation output badge */}
            {customSpec ? (
              <div className="mt-4 bg-white rounded-xl p-4 border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-sm">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-base font-black text-slate-900">{customOrig} ⇄ {customDest}</span>
                    <span className={"text-[11px] font-bold px-2 py-0.5 rounded-full " + (customSpec.type === "Domestic" ? "bg-slate-100 text-slate-700" : "bg-indigo-50 text-indigo-700")}>
                      {customSpec.type}
                    </span>
                    <span className="text-xs font-bold text-slate-500 font-mono">
                      {customSpec.dist.toLocaleString()} statute miles
                    </span>
                  </div>
                  <div className="text-xs text-slate-600 mt-1">
                    {customSpec.orig.city} to {customSpec.dest.city} • Est. Base Fare: <b>${customSpec.fare}</b> • Earns: <b style={{ color: t.primary }}>+{fmt(customPts)} {airline.metric}</b> per segment
                  </div>
                </div>

                <div className="flex items-center justify-between sm:justify-end gap-4">
                  <div className="text-right">
                    <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Remaining to Qualify</div>
                    {gap <= 0 ? (
                      <div className="text-sm font-black text-emerald-600">Goal Reached! ✓</div>
                    ) : customPts === 0 ? (
                      <div className="text-xs font-bold text-amber-600">0 {airline.metric} (Basic Economy)</div>
                    ) : (
                      <div className="text-lg font-black" style={{ color: t.primary }}>
                        {customRem} <span className="text-xs font-bold text-slate-600">flights needed ({usd(customTotalCost)})</span>
                      </div>
                    )}
                  </div>
                  <button
                    onClick={() => onAddFlightSpend(customSpec.fare, customCabin === "basic" && airline.key === "united" ? 0 : 1)}
                    className="px-4 py-2 text-xs font-bold rounded-xl text-white shadow hover:brightness-110 transition whitespace-nowrap"
                    style={{ background: t.primary }}
                  >
                    + Add This Flight
                  </button>
                </div>
              </div>
            ) : (
              <p className="mt-3 text-xs text-slate-500">Select different origin and destination airports to calculate.</p>
            )}
          </div>

          {/* SECTION 2: Filterable & Sortable Route Catalog Table */}
          <div>
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 pb-3">
              <div>
                <h4 className="font-bold text-base text-slate-900">Standard Route Catalog ({filteredRoutes.length} Routes)</h4>
                <p className="text-xs text-slate-500">Browse and sort prominent domestic feeders, trunks, transcons, Hawaii, and global flagship flights.</p>
              </div>

              {/* Filtering Controls */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="inline-flex p-1 bg-slate-100 rounded-lg">
                  {["All", "Domestic", "International"].map((type) => (
                    <button
                      key={type}
                      onClick={() => setFilterType(type)}
                      className={"px-3 py-1 rounded-md text-xs font-bold transition " + (filterType === type ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-900")}
                    >
                      {type}
                    </button>
                  ))}
                </div>

                <select
                  value={cabinClass}
                  onChange={(e) => setCabinClass(e.target.value)}
                  className="text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-800 shadow-sm focus:outline-none"
                >
                  <option value="main">Standard Economy</option>
                  <option value="premium">Premium / First Cabin</option>
                  <option value="basic">Basic Economy</option>
                </select>

                <select
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  className="text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-800 shadow-sm focus:outline-none"
                >
                  <option value="remAsc">Fewest Flights Needed</option>
                  <option value="fareAsc">Lowest Base Fare</option>
                  <option value="distDesc">Longest Flight Distance</option>
                </select>
              </div>
            </div>

            {/* Quick Search */}
            <div className="mt-2 flex items-center gap-2">
              <div className="relative flex-1">
                <input
                  type="text"
                  placeholder="Filter catalog by airport code or city (e.g. BOS, LGA, LAX, HND, Tokyo, London, Miami)..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full text-xs rounded-xl border border-slate-200 px-3.5 py-2 pl-9 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[var(--accent)]"
                />
                <svg className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              </div>
              {searchQuery && (
                <button onClick={() => setSearchQuery("")} className="text-xs text-slate-500 hover:text-slate-800 underline">Clear</button>
              )}
            </div>

            {/* Table */}
            <div className="mt-3 overflow-x-auto max-h-[380px] overflow-y-auto border border-slate-100 rounded-xl">
              <table className="w-full text-left text-sm">
                <thead className="sticky top-0 bg-slate-50 z-10 shadow-sm">
                  <tr className="border-b border-slate-200 text-xs font-bold uppercase tracking-wider text-slate-500">
                    <th className="py-2.5 px-3">Route & Region</th>
                    <th className="py-2.5 px-3">Type</th>
                    <th className="py-2.5 px-3 text-right">Distance</th>
                    <th className="py-2.5 px-3 text-right">Est. Base Fare</th>
                    <th className="py-2.5 px-3 text-right">{airline.metric} Earned</th>
                    <th className="py-2.5 px-3 text-center">Remaining to Qualify</th>
                    <th className="py-2.5 px-3 text-right">Simulate</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-medium">
                  {filteredRoutes.map((r) => {
                    const isBasicZero = cabinClass === "basic" && airline.key === "delta";
                    return (
                      <tr key={r.id} className="hover:bg-slate-50 transition">
                        <td className="py-2.5 px-3">
                          <div className="font-bold text-slate-900 flex items-center gap-1.5">
                            {r.name}
                            <span className="text-[10px] font-semibold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">{r.region}</span>
                          </div>
                          <div className="text-xs text-slate-500 mt-0.5">{r.label}</div>
                        </td>
                        <td className="py-2.5 px-3">
                          <span className={"inline-block text-[11px] font-bold px-2 py-0.5 rounded-full " + (r.type === "Domestic" ? "bg-slate-100 text-slate-700" : "bg-indigo-50 text-indigo-700")}>
                            {r.type}
                          </span>
                        </td>
                        <td className="py-2.5 px-3 text-right tabular-nums text-slate-600 font-mono text-xs">{r.dist.toLocaleString()} mi</td>
                        <td className="py-2.5 px-3 text-right tabular-nums font-semibold text-slate-800">${r.fare}</td>
                        <td className="py-2.5 px-3 text-right tabular-nums font-bold" style={{ color: isBasicZero ? "#94a3b8" : t.primary }}>
                          {isBasicZero ? "0 MQD (Basic)" : `+${fmt(r.pts)} ${airline.metric}`}
                        </td>
                        <td className="py-2.5 px-3 text-center">
                          {gap <= 0 ? (
                            <span className="text-xs font-bold text-emerald-600">Qualified ✓</span>
                          ) : isBasicZero ? (
                            <span className="text-xs text-amber-600 font-medium">Earns 0 (N/A)</span>
                          ) : (
                            <span className="inline-block px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-slate-100 text-slate-900 shadow-sm border border-slate-200">
                              <b>{r.rem}</b> flights
                            </span>
                          )}
                        </td>
                        <td className="py-2.5 px-3 text-right">
                          <button
                            onClick={() => onAddFlightSpend(r.fare, cabinClass === "basic" && airline.key === "united" ? 0 : 1)}
                            className="px-2.5 py-1 text-xs font-bold rounded-lg border border-slate-300 hover:border-slate-400 bg-white hover:bg-slate-50 transition shadow-sm"
                            title="Add this flight to planned spending above"
                          >
                            + Add
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div className="mt-3 flex flex-wrap items-center justify-between text-xs text-slate-500 px-1 gap-2">
              <span>💡 <b>Mileage & Points Note:</b> Delta Basic Economy earns 0 MQD; American Basic earns 2 LP/$; Regular Main Cabin earns 5 LP/$. United segment requires non-Basic fare for PQF count.</span>
              <span>Click <b>+ Add</b> to simulate adding that trip to your planned spending above.</span>
            </div>
          </div>
        </div>
      );
    }


    function NumberField({ label, value, onChange, prefix, suffix, hint }) {
      return (
        <label className="block">
          <span className="text-sm font-semibold text-slate-700">{label}</span>
          <div className="mt-1 flex items-center rounded-xl border border-slate-300 bg-white focus-within:ring-2 focus-within:ring-[var(--accent)] overflow-hidden">
            {prefix && <span className="pl-3 text-slate-400 font-semibold">{prefix}</span>}
            <input type="text" inputMode="numeric" value={value === 0 ? "" : fmt(value)} placeholder="0"
              onChange={(e) => onChange(num(e.target.value))}
              className="w-full px-3 py-2.5 outline-none tabular-nums font-semibold" />
            {suffix && <span className="pr-3 text-slate-400 text-sm font-semibold">{suffix}</span>}
          </div>
          {hint && <span className="mt-1 block text-xs text-slate-500">{hint}</span>}
        </label>
      );
    }

    function FlightCalc({ airline, state, set }) {
      const t = airline.theme;
      const flightPts = state.flightSpend * airline.flightRate;
      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
          <div className="flex items-center justify-between">
            <h3 className="font-bold text-lg">✈️ Flight Tracking</h3>
            <span className="text-xs font-semibold px-2 py-1 rounded-full theme-fade" style={{ background: t.soft, color: t.primary }}>{airline.flightNote}</span>
          </div>
          <div className="mt-4 grid gap-4">
            <NumberField label={`Current posted ${airline.metric}`} value={state.posted} onChange={(v) => set({ posted: v })} suffix={airline.metric}
              hint={`From your ${airline.program} account dashboard (exclude card earnings modeled below).`} />
            <NumberField label="Planned upcoming flight spending" value={state.flightSpend} onChange={(v) => set({ flightSpend: v })} prefix="$" suffix="USD"
              hint="Base fare + carrier-imposed surcharges (excludes government taxes & fees)." />
            {airline.key === "united" && (
              <div className="grid grid-cols-2 gap-4">
                <NumberField label="Posted PQF" value={state.pqfPosted} onChange={(v) => set({ pqfPosted: v })} suffix="PQF" />
                <NumberField label="Planned segments" value={state.pqfPlanned} onChange={(v) => set({ pqfPlanned: v })} suffix="PQF" />
              </div>
            )}
            <div className="rounded-xl p-4 flex justify-between items-center theme-fade" style={{ background: t.soft }}>
              <span className="text-sm text-slate-600">Upcoming flights will earn</span>
              <span className="text-xl font-extrabold tabular-nums" style={{ color: t.primary }}>+{fmt(flightPts)} {airline.metric}</span>
            </div>
          </div>
        </div>
      );
    }

    function CardCalc({ airline, state, set, earn }) {
      const t = airline.theme;
      const card = airline.cards.find((c) => c.id === state.cardId) || airline.cards[0];
      const pct = (state.cardSpend / SLIDER_MAX) * 100;
      const sliderBg = `linear-gradient(to right, ${t.accent} 0%, ${t.accent} ${pct}%, #e5e7eb ${pct}%, #e5e7eb 100%)`;
      const nextMilestone = (() => {
        if (card.id === "none") return null;
        if (airline.key === "united") {
          const next = (Math.floor(state.cardSpend / card.chunk) + 1) * card.chunk;
          return next <= SLIDER_MAX ? `Next +500 PQP at ${usd(next)} (${usd(next - state.cardSpend)} away)` : null;
        }
        if (airline.key === "american" && card.bonusAt && state.cardSpend < card.bonusAt) {
          return `+10,000 bonus LP unlocks at ${usd(card.bonusAt)} (${usd(card.bonusAt - state.cardSpend)} away)`;
        }
        return null;
      })();

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
          <div className="flex items-center justify-between">
            <h3 className="font-bold text-lg">💳 Card Spending Simulator</h3>
            {card.fee && <span className="text-xs text-slate-500">Annual fee {card.fee}</span>}
          </div>
          <div className="mt-4 grid gap-4">
            <label className="block">
              <span className="text-sm font-semibold text-slate-700">Co-branded card</span>
              <select value={card.id} onChange={(e) => set({ cardId: e.target.value })}
                className="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 font-semibold focus:outline-none focus:ring-2 focus:ring-[var(--accent)]">
                {airline.cards.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <span className="mt-1 block text-xs text-slate-500">{card.rateLabel}</span>
            </label>

            {airline.key === "delta" && (
              <label className={"flex items-start gap-3 rounded-xl border p-3 cursor-pointer " + (card.id === "none" ? "opacity-50 cursor-not-allowed" : "")}>
                <input type="checkbox" className="mt-0.5 w-5 h-5" style={{ accentColor: t.accent }}
                  disabled={card.id === "none"} checked={state.headstart && card.id !== "none"} onChange={(e) => set({ headstart: e.target.checked })} />
                <span>
                  <span className="block text-sm font-semibold">Annual $2,500 MQD Card Headstart Boost</span>
                  <span className="block text-xs text-slate-500">Deposited each year to Reserve & Platinum Card Members.</span>
                </span>
              </label>
            )}

            <div>
              <div className="flex justify-between items-baseline">
                <span className="text-sm font-semibold text-slate-700">Annual card spend</span>
                <span className="text-2xl font-extrabold tabular-nums">{usd(state.cardSpend)}</span>
              </div>
              <input type="range" min="0" max={SLIDER_MAX} step="500" value={state.cardSpend}
                onChange={(e) => set({ cardSpend: Number(e.target.value) })}
                className="w-full mt-3" style={{ background: sliderBg }} disabled={card.id === "none"} aria-label="Annual card spend" />
              <div className="flex justify-between text-xs text-slate-400 mt-1"><span>$0</span><span>$75k</span><span>$150k</span></div>
              {nextMilestone && <p className="mt-2 text-xs font-semibold" style={{ color: t.accent }}>{nextMilestone}</p>}
            </div>

            <div className="rounded-xl p-4 theme-fade" style={{ background: t.soft }}>
              <div className="flex justify-between items-center">
                <span className="text-sm text-slate-600">Card contribution</span>
                <span className="text-xl font-extrabold tabular-nums" style={{ color: t.primary }}>+{fmt(earn.pts)} {airline.metric}</span>
              </div>
              {(earn.headstart > 0 || earn.bonus > 0) && (
                <p className="mt-1 text-xs text-slate-600">
                  {fmt(earn.spendPts)} from spend
                  {earn.headstart > 0 && <> + {fmt(earn.headstart)} Headstart</>}
                  {earn.bonus > 0 && <> + {fmt(earn.bonus)} spend bonus</>}
                </p>
              )}
            </div>
          </div>
        </div>
      );
    }

    function AffiliateBanner({ airline }) {
      const t = airline.theme;
      const a = airline.affiliate;
      return (
        <aside className="rounded-2xl overflow-hidden shadow-sm theme-fade text-white relative" style={{ background: `linear-gradient(120deg, ${t.gradFrom}, ${t.gradTo})` }}>
          <div className="absolute -right-16 -top-16 w-56 h-56 rounded-full opacity-20" style={{ background: airline.key === "american" ? t.red : t.accent === t.primary ? "#7fb8e6" : t.accent }}></div>
          <div className="relative p-6 sm:p-8 grid md:grid-cols-[1fr_auto] gap-6 items-center">
            <div>
              <span className="text-[10px] uppercase tracking-widest font-bold bg-white/15 rounded-full px-2 py-1">Sponsored • Status Accelerator</span>
              <h3 className="mt-3 text-2xl font-extrabold">{a.title}</h3>
              <ul className="mt-3 grid sm:grid-cols-2 gap-x-6 gap-y-1.5 text-sm text-white/90">
                {a.bullets.map((b) => <li key={b} className="flex gap-2"><span style={{ color: airline.key === "american" ? "#ff8a9b" : "#9fd3ff" }}>✔</span>{b}</li>)}
              </ul>
              <p className="mt-3 text-[11px] text-white/60">Terms apply. Card benefits and earning rates may change; verify on the issuer's site before applying. We may earn a commission from qualifying applications.</p>
            </div>
            <a href="#" onClick={(e) => e.preventDefault()}
              className="inline-flex items-center justify-center gap-2 rounded-xl px-6 py-3 font-bold shadow-lg hover:brightness-110 transition whitespace-nowrap"
              style={{ background: airline.key === "american" ? t.red : (airline.key === "delta" ? t.accent : "#ffffff"), color: airline.key === "united" ? t.primary : "#fff" }}>
              {a.cta} →
            </a>
          </div>
        </aside>
      );
    }

    /* ---------------- App ---------------- */
    const defaultState = () => ({
      delta: { posted: 3200, flightSpend: 2500, cardId: "reserve", cardSpend: 30000, headstart: true, target: 1 },
      united: { posted: 4200, flightSpend: 3000, pqfPosted: 10, pqfPlanned: 8, cardId: "clubinf", cardSpend: 24000, target: 1 },
      american: { posted: 15000, flightSpend: 3000, cardId: "exec", cardSpend: 30000, target: 1 },
    });

    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem("statusrun-us") || "null");
        if (s && s.delta && s.united && s.american) return s;
      } catch (e) {}
      return null;
    }

    function App() {
      const saved = useMemo(loadState, []);
      const [airlineKey, setAirlineKey] = useState(saved?.airlineKey || "delta");
      const [data, setData] = useState(saved?.data || defaultState());

      useEffect(() => {
        try { localStorage.setItem("statusrun-us", JSON.stringify({ airlineKey, data })); } catch (e) {}
      }, [airlineKey, data]);

      const airline = AIRLINES[airlineKey];
      const t = airline.theme;
      const st = data[airlineKey];
      const set = (patch) => setData((d) => ({ ...d, [airlineKey]: { ...d[airlineKey], ...patch } }));
      const tier = airline.tiers[st.target];
      const card = airline.cards.find((c) => c.id === st.cardId) || airline.cards[0];

      useEffect(() => {
        document.documentElement.style.setProperty("--accent", t.accent);
        const meta = document.querySelector('meta[name="theme-color"]') || Object.assign(document.createElement("meta"), { name: "theme-color" });
        meta.content = t.primary; document.head.appendChild(meta);
      }, [airlineKey]);

      const earn = cardEarn(airline, card, st.cardSpend, st.headstart);
      const flightPts = st.flightSpend * airline.flightRate;
      const total = st.posted + flightPts + earn.pts;
      const pqf = (st.pqfPosted || 0) + (st.pqfPlanned || 0);

      const qualifiesFor = (tr) => total >= tr.req || (tr.alt && total >= tr.alt.pqp && pqf >= tr.alt.pqf);
      const achievedIdx = airline.tiers.reduce((acc, tr, i) => (qualifiesFor(tr) ? i : acc), -1);
      const viaAlt = total < tier.req && !!tier.alt && total >= tier.alt.pqp && pqf >= tier.alt.pqf;
      const qualified = qualifiesFor(tier);

      const calc = {
        total, pqf, viaAlt, qualified,
        gap: qualified ? 0 : Math.max(0, tier.req - total),
        segments: [
          { label: "Posted", value: st.posted, color: t.primary },
          { label: "Planned flights", value: flightPts, color: airline.key === "united" ? "#4a9be0" : (airline.key === "american" ? "#5d7489" : "#3d6a9c") },
          { label: "Card", value: earn.pts, color: airline.key === "american" ? t.accent : (airline.key === "united" ? "#0a8f5a" : t.accent) },
        ],
      };

      const handleAddFlightSpend = (addFare, addPqf = 1) => {
        set({
          flightSpend: st.flightSpend + addFare,
          pqfPlanned: (st.pqfPlanned || 0) + addPqf,
        });
      };

      return (
        <div className="min-h-screen flex flex-col">
          <Header airlineKey={airlineKey} setAirlineKey={setAirlineKey} theme={t} />
          <Hero airline={airline} targetIdx={st.target} setTargetIdx={(i) => set({ target: i })} achievedIdx={achievedIdx} />

          <main className="flex-1 max-w-6xl w-full mx-auto px-4 -mt-6 pb-12 grid gap-6">
            <div className="grid lg:grid-cols-2 gap-6">
              <ProgressCard airline={airline} tier={tier} calc={calc} />
              <GapStrategy airline={airline} card={card} calc={calc} cardSpend={st.cardSpend} headstartOn={st.headstart} />
            </div>

            <div className="rounded-xl bg-white border border-slate-200 px-5 py-3 text-sm flex flex-wrap gap-x-6 gap-y-1 items-center">
              <span className="font-semibold">Current projection:</span>
              <span>{achievedIdx >= 0 ? <>You're on track for <b style={{ color: t.primary }}>{airline.tiers[achievedIdx].name}</b></> : <>Below <b>{airline.tiers[0].name}</b> ({fmt(airline.tiers[0].req - total)} {airline.metric} to go)</>}</span>
              {achievedIdx >= 0 && achievedIdx < airline.tiers.length - 1 && (
                <span className="text-slate-500">Next: {airline.tiers[achievedIdx + 1].name} in {fmt(airline.tiers[achievedIdx + 1].req - total)} {airline.metric}</span>
              )}
            </div>

            {/* JAL Simulator style: Domestic & International Route Runway & Segment Planner */}
            <RouteRunwayPlanner airline={airline} gap={calc.gap} onAddFlightSpend={handleAddFlightSpend} />

            <div className="grid lg:grid-cols-2 gap-6">
              <FlightCalc airline={airline} state={st} set={set} />
              <CardCalc airline={airline} state={st} set={set} earn={earn} />
            </div>

            <AffiliateBanner airline={airline} />

            <div className="flex justify-end">
              <button onClick={() => setData((d) => ({ ...d, [airlineKey]: defaultState()[airlineKey] }))}
                className="text-sm font-semibold text-slate-500 hover:text-slate-800 underline underline-offset-4">Reset {airline.short} inputs</button>
            </div>
          </main>

          <footer className="border-t border-slate-200 bg-white">
            <div className="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-slate-500">
              <p className="font-semibold text-slate-600">StatusRun US • BUS 131A Project Demo • Not affiliated with Delta, United, or American Airlines.</p>
              <p className="mt-1 text-xs">Estimates only, based on simplified 2026 program rules. Always confirm qualification criteria with the airline.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
